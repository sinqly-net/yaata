<div class="grid grid-cols-8 gap-4">
  @let collections = globalSelectionStore.selectedWorkspace?.()?.workspace?.collections;
  @for (collection of collections; track collection.id) {
    <app-collection-item [collection]="collection"
                         [workspace]="globalSelectionStore.selectedWorkspace!()!.workspace"></app-collection-item>
  }
</div>
