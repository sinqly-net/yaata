@if (isOpen()) {
  <div
    class="fixed z-50 min-w-[200px] bg-slate-800/95 border border-slate-700/90 rounded-lg shadow-2xl backdrop-blur-md p-1.5 text-xs text-slate-200 select-none animate-in fade-in duration-100 font-sans"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
    (click)="$event.stopPropagation()"
  >
    <!-- Folder Context Menu -->
    @if (targetType() === 'folder') {
      <div class="px-2 py-1 mb-1 border-b border-slate-700/60 flex items-center gap-1.5 text-[11px] font-semibold text-slate-400">
        <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="currentColor" viewBox="0 0 20 20">
          <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" />
        </svg>
        <span class="truncate max-w-[150px]">{{ targetFolder()?.name }}</span>
      </div>

      <button
        type="button"
        (click)="triggerCreateRequest()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/80 hover:text-white text-slate-300 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-emerald-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>Neue Anfrage erstellen</span>
      </button>

      <button
        type="button"
        (click)="triggerCreateSubfolder()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/80 hover:text-white text-slate-300 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-amber-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
        </svg>
        <span>Neuer Unterordner</span>
      </button>

      <div class="my-1 border-t border-slate-700/60"></div>

      <button
        type="button"
        (click)="triggerRenameFolder()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/80 hover:text-white text-slate-300 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-sky-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span>Umbenennen</span>
      </button>

      <button
        type="button"
        (click)="triggerDissolveFolder()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-amber-950/40 hover:text-amber-300 text-amber-400/90 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-amber-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        <span>Ordner auflösen</span>
      </button>

      <div class="my-1 border-t border-slate-700/60"></div>

      <button
        type="button"
        (click)="triggerDeleteFolder()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-rose-950/60 hover:text-rose-200 text-rose-400 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-rose-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Ordner löschen</span>
      </button>
    }

    <!-- Request Context Menu -->
    @if (targetType() === 'request') {
      <div class="px-2 py-1 mb-1 border-b border-slate-700/60 flex items-center gap-1.5 text-[11px] font-semibold text-slate-400">
        <span class="text-[9px] font-mono font-bold px-1 py-0.2 rounded uppercase bg-slate-900 border border-slate-700 text-sky-400">
          {{ targetRequest()?.method }}
        </span>
        <span class="truncate max-w-[140px]">{{ targetRequest()?.name }}</span>
      </div>

      <button
        type="button"
        (click)="triggerRenameRequest()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/80 hover:text-white text-slate-300 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-sky-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <span>Umbenennen</span>
      </button>

      <button
        type="button"
        (click)="triggerDuplicateRequest()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-slate-700/80 hover:text-white text-slate-300 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-emerald-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        <span>Duplizieren</span>
      </button>

      <div class="my-1 border-t border-slate-700/60"></div>

      <button
        type="button"
        (click)="triggerDeleteRequest()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded hover:bg-rose-950/60 hover:text-rose-200 text-rose-400 transition-colors text-left cursor-pointer group"
      >
        <svg class="w-4 h-4 text-rose-400 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Anfrage löschen</span>
      </button>
    }
  </div>
}
