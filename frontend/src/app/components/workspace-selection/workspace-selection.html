<div class="h-full flex flex-col justify-start">
  <div class="p-2 bg-slate-800/90 border border-slate-700/80 rounded-2xl flex flex-col items-center gap-2.5 shadow-lg backdrop-blur-sm">
    <!-- Workspaces List -->
    <div class="flex flex-col items-center gap-2">
      @for (workspaceAccess of globalSelectionStore.permittedWorkspaces(); track workspaceAccess.id) {
        <app-workspace-selection-item
          [workspace]="workspaceAccess.workspace"
          (edit)="openEdit($event)"
          (share)="openShare($event)">
        </app-workspace-selection-item>
      }
    </div>

    <!-- Divider -->
    <div class="w-6 h-px bg-slate-700/80"></div>

    <!-- Add Workspace Button -->
    <button
      type="button"
      (click)="openCreate()"
      [tooltip]="'Neuen Workspace erstellen'"
      tooltipPlacement="right"
      [tooltipAppendToBody]="true"
      class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-dashed border-slate-600 hover:border-sky-400 text-slate-400 hover:text-sky-400 flex items-center justify-center transition-all duration-150 cursor-pointer shadow-sm group"
      title="Neuen Workspace erstellen">
      <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </button>
  </div>
</div>

<!-- Modal for Create / Edit Workspace -->
<app-workspace-modal></app-workspace-modal>
<app-workspace-share-modal></app-workspace-share-modal>
