@if (isOpen()) {
  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
    <!-- Modal Dialog -->
    <div
      class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden text-slate-200 animate-in fade-in zoom-in-95 duration-150">
      <!-- Modal Header -->
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-700/80 bg-slate-850">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-sky-400" fill="currentColor" viewBox="0 0 24 24">
            <path clip-rule="evenodd" d="M5.024 3.783A1 1 0 0 1 6 3h12a1 1 0 0 1 .976.783L20.802 12h-4.244a1.99 1.99 0 0 0-1.824 1.205 2.978 2.978 0 0 1-5.468 0A1.991 1.991 0 0 0 7.442 12H3.198l1.826-8.217ZM3 14v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5h-4.43a4.978 4.978 0 0 1-9.14 0H3Z" fill-rule="evenodd"/>
          </svg>
          <span class="font-semibold text-sm">
            @if (mode() === 'create') {
              Neuen Workspace erstellen
            } @else {
              Workspace umbenennen
            }
          </span>
        </div>
        <button
          type="button"
          (click)="close()"
          class="text-slate-400 hover:text-white transition-colors p-1 rounded-md hover:bg-slate-700 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <form (ngSubmit)="save()" class="p-5 space-y-4 text-xs">
        <!-- Feedback Messages -->
        @if (errorMessage()) {
          <div class="p-2.5 rounded bg-rose-950/80 border border-rose-800 text-rose-300">
            {{ errorMessage() }}
          </div>
        }

        <div class="space-y-1.5">
          <label class="block text-slate-300 font-medium">Name des Workspaces</label>
          <input
            type="text"
            [ngModel]="nameInput()"
            (ngModelChange)="nameInput.set($event)"
            name="workspaceName"
            placeholder="z. B. Mein Team-Workspace"
            autofocus
            class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded text-slate-100 placeholder:text-slate-500 focus:outline-none focus:border-sky-500 text-xs">
        </div>

        <!-- Modal Footer -->
        <div class="pt-3 border-t border-slate-700/80 flex justify-end gap-2">
          <button
            type="button"
            (click)="close()"
            class="px-3.5 py-1.5 rounded bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium text-xs transition-colors cursor-pointer">
            Abbrechen
          </button>
          <button
            type="submit"
            [disabled]="!nameInput().trim() || isLoading()"
            class="px-4 py-1.5 rounded bg-sky-600 hover:bg-sky-500 disabled:bg-slate-700 disabled:text-slate-400 disabled:cursor-not-allowed text-white font-medium text-xs transition-colors cursor-pointer flex items-center gap-1.5">
            @if (isLoading()) {
              <svg class="animate-spin h-3.5 w-3.5 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            }
            @if (mode() === 'create') {
              Workspace erstellen
            } @else {
              Speichern
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
