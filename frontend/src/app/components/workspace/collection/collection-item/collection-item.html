<button
  type="button"
  (click)="selectCollection()"
  [class.bg-sky-600]="isSelected()"
  [class.text-white]="isSelected()"
  [class.border-sky-400]="isSelected()"
  [class.shadow-md]="isSelected()"
  [class.shadow-sky-950/40]="isSelected()"
  [class.bg-slate-700/60]="!isSelected()"
  [class.text-slate-300]="!isSelected()"
  [class.border-slate-600/60]="!isSelected()"
  [class.hover:bg-slate-700/90]="!isSelected()"
  [class.hover:text-white]="!isSelected()"
  [class.hover:border-slate-500]="!isSelected()"
  class="group flex items-center gap-2 px-3 py-1.5 rounded-lg border transition-all duration-150 cursor-pointer text-xs whitespace-nowrap">
  
  <svg class="w-3.5 h-3.5 shrink-0 transition-colors"
       [class.text-white]="isSelected()"
       [class.text-sky-400]="!isSelected()"
       fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
  </svg>

  <span class="font-medium tracking-wide">{{ collection().name }}</span>

  <span
    [class.bg-sky-700]="isSelected()"
    [class.text-sky-100]="isSelected()"
    [class.bg-slate-800/80]="!isSelected()"
    [class.text-slate-400]="!isSelected()"
    class="text-[10px] px-1.5 py-0.2 rounded-full font-mono font-medium ml-0.5">
    {{ collection().folders.length }} Ordner
  </span>
</button>
