<div
  class="group flex items-center gap-2 p-1.5 rounded-lg border transition-all duration-150 mb-1"
  [class.bg-slate-800/80]="!item().disabled"
  [class.border-slate-700/80]="!item().disabled"
  [class.hover:border-slate-600]="!item().disabled"
  [class.bg-slate-900/40]="item().disabled"
  [class.border-slate-800/60]="item().disabled"
  [class.opacity-50]="item().disabled">

  <!-- Active / Inactive Checkbox -->
  <div class="w-8 flex items-center justify-center shrink-0">
    <button
      type="button"
      (click)="onToggle(!isActive())"
      [title]="item().disabled ? 'Eintrag aktivieren' : 'Eintrag deaktivieren'"
      [class.bg-sky-500]="isActive()"
      [class.border-sky-500]="isActive()"
      [class.bg-slate-900]="!isActive()"
      [class.border-slate-600]="!isActive()"
      class="w-4 h-4 rounded border transition-colors flex items-center justify-center cursor-pointer focus:outline-none focus:ring-2 focus:ring-sky-500/40">
      @if (isActive()) {
        <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
      }
    </button>
  </div>

  <!-- Key & Value Inputs -->
  <div class="flex-1 grid grid-cols-2 gap-2 min-w-0">
    <!-- Key Input -->
    <div class="relative">
      <input
        type="text"
        [value]="item().key"
        (input)="onKeyInput($any($event.target).value)"
        placeholder="Key / Name"
        [class.line-through]="item().disabled"
        [class.text-slate-500]="item().disabled"
        [class.text-slate-200]="!item().disabled"
        class="w-full bg-slate-900/70 border border-slate-700/70 rounded-md px-2.5 py-1 text-xs font-mono placeholder:text-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-colors h-full">
    </div>

    <!-- Value Input with Variable Support -->
    <div class="relative min-w-0">
      <app-variable-input
        [value]="item().value"
        (valueChange)="onValueInput($event)"
        [disabled]="item().disabled || false"
        placeholder="Wert oder ${request.field}"
        containerClass="bg-slate-900/70 border-slate-700/70 py-0.5" />
    </div>
  </div>

  <!-- Delete Row Button -->
  <div class="w-10 flex items-center justify-center shrink-0">
    <button
      type="button"
      (click)="removeItem()"
      class="text-slate-500 hover:text-rose-400 p-1 rounded-md hover:bg-rose-500/10 transition-colors cursor-pointer"
      title="Eintrag entfernen">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    </button>
  </div>
</div>
